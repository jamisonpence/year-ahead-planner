[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = [
  "node --max-old-space-size=3072 node_modules/.bin/tsx script/build-client.ts",
  "node --max-old-space-size=3072 node_modules/.bin/tsx script/build-server.ts"
]

[start]
cmd = "npm start"
